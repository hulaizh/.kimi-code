interface:
  display_name: "LaTeX Formatting"
  short_description: "Format finance/economics LaTeX: papers in the one working-paper format (validate, compile), a journal's house style only once the paper is accepted, and Beamer slides"
  default_prompt: "Use $latex to format my working paper or slides, or to convert an accepted paper to its journal's house style."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
