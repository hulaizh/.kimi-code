interface:
  display_name: "Finance PDF report"
  short_description: "Create and inspect concise A4 finance reports and analytical memos."
  default_prompt: "Use $latex to create or compile my finance memo as an A4 PDF, keeping generated exhibits separate from captions and notes."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
