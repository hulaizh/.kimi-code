# Management Science
journal: MS
name: Management Science
sources:
  - "https://pubsonline.informs.org/page/mnsc/submission-guidelines (bot-walled on 2026-09-12; facts carried from the plugin's entry verified 2026-08-11): 1. spacing at a minimum or double-spaced, 11-point font, 1-inch margins all around; abstract <= 250 words; no cap on initial submissions but every invited revision must adhere to 47 pages at double spacing (25 lines per page) or 32 pages at 1.5 spacing (33 lines per page), online appendix / electronic companion excluded — enforced from the start"
