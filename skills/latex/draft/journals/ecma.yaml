# Econometrica
journal: Econometrica
name: Econometrica
sources:
  - "https://www.econometricsociety.org/publications/econometrica/information-authors/instructions-submitting-articles (verified 2026-09-12): PDF; papers limited to 45 pages including references and appendices; font size at least 12 points, line spacing at least 1.5, all margins at least 1.25 inches, applied to the entire manuscript including references and appendices; footnotes and figures should not be placed at the end of the document; pages numbered; the title page includes an abstract of no more than 150 words, keywords and full author affiliations (JEL codes optional); a supplemental appendix of at most 25 pages in the same format is posted under 'Supplemental Material'; no \textcircled{r} random-order symbol"
layout:
  paper: letterpaper
  font_pt: 12
  margins: 1.25in
  spacing: [onehalf, double]
length:
  pages: 45
  appendix_pages: 25
  abstract_words: 150
structure:
  appendix_title: Supplemental Material
  exhibits: inline
  title_page: full
  jel: false
  keywords: true
citations:
  in_text: citep
  full_authors_first: false
house:
  - id: no_random_order_symbol
    rule: No \textcircled{r} certified-random-order symbol in the byline; describe the author-ordering method in a footnote instead.
    locate: '\\textcircled\{r\}'
