# Journal of Financial and Quantitative Analysis — the ACCEPTED-paper style
journal: JFQA
name: Journal of Financial and Quantitative Analysis
sources:
  - "https://jfqa.org/submissions/style-guide-for-accepted-and-conditionally-accepted-papers/ (fetched 2026-09-13, verbatim): title page with title, author name(s), affiliation(s), e-mail address(es) and the abstract (one paragraph, non-indented, <= 100 words), acknowledgment asterisk at the end of the byline; 12-point body; double-space, left-align and cancel hyphenation (\\setstretch{2}\\raggedright), \\parindent=.5in reinstated after \\raggedright, indentfirst; inline comments locating figures and tables; abbreviations defined at first use (also in table/figure descriptions and the abstract); table/figure description above the table (below the title); tables and figures numbered with ARABIC numerals; equation numbers in parentheses at the left margin, top-aligned for multi-line equations, cited as 'equation (1)'; sequential numeral column headings without parentheses; LaTeX users combine all .tex files of the main manuscript into a single .tex file; three or more authors listed in full on first citation, 'et al.' after; each citation year within parentheses, citations within parentheses separated by commas, page/equation refs inside the parentheses; citations inline, never in footnotes; sections numbered with roman numerals, subsections A/B/C, subsubsections 1/2/3, cited by the full number ('Section III.B.3'); headings at ALL levels, table and figure titles, legends and axis labels in title case; serial comma; '×' for multiplication; affiliations as main institution followed by school with no comma"
  - "https://www.jfqa.org/submissions (verified 2026-09-12; new submissions and resubmissions): 8.5 x 11 paper, 1in margins, 12-point Times New Roman, abstract <= 100 words, blind manuscript at submission, accepted papers rarely exceed 40-45 pages"
verified:
  date: 2026-09-13
  sections: [layout, length, structure, citations]
layout:
  paper: letterpaper
  font_pt: 12
  font: times
  class_options: [leqno]
  margins: 1in
  spacing: double
  ragged_right: true
  hyphenation: false
  parindent: 0.5in
  preamble:
    - "\\usepackage{setspace}"
    - "\\usepackage{indentfirst}   % JFQA: indent the first paragraph after every heading too"
    - "\\usepackage[tbtags]{amsmath}   % JFQA: with leqno, tbtags top-aligns multi-line equation numbers"
length:
  pages: 45
  abstract_words: 100
structure:
  numbering: {section: Roman, subsection: Alph, subsubsection: arabic}
  exhibit_numbering: {table: arabic, figure: arabic}
  appendix_title: Supplementary Material
  exhibits: end
  float_markers: true
  title_page: full
  jel: false
  keywords: false
citations:
  bst: JFQA
  bst_companions: [babelbst.tex, englbst.tex]   # JFQA.bst \inputs these at bibtex time; they ship with it
  in_text: citet_in_parens
  full_authors_first: true
  equation_ref: "equation (N)"
  stars: superscript
house:
  - id: true_double_spacing
    rule: "JFQA's double spacing is \\setstretch{2} (setspace's \\doublespacing is 1.667 at 12pt). Write it in main.tex where the body spacing is declared — replace the body's \\doublespacing with \\setstretch{2}, which the validator's grammar reads as double spacing — never through a preamble \\def of \\doublespacing: a definition whose body changes the spacing is refused (the page cap is keyed on what main.tex states), and `apply` deletes a legacy one."
    locate: '\\doublespacing'
  - id: single_tex_file
    rule: "Production takes ONE .tex file: combine every \\input (sections, tables, figures) into the main file before submitting the accepted version — record it under Decisions."
  - id: parenthetical_stats
    rule: No parenthetical statistic in running text; state it in prose or leave it to the table notes.
    example: {before: "(t = 3.06)", after: ", with a t-statistic of 3.06"}
    locate: '\(\s*\$?\s*(t|p|z|F)\s*[=<>]'
  - id: repeat_citation_short
    rule: Three or more authors are listed in full on a work's first citation and as "et al." afterwards; \citeauthor when the same year repeats within one sentence.
  - id: headings_title_case
    rule: Headings at every level, table and figure titles, legends and axis labels are in title case.
    locate: '^\\(sub)*section\{'
  - id: section_cross_refs
    rule: "Sections are cited by their full number — 'Section III.B.3' — never by a bare subsection letter or a section name."
    locate: '\bSection\s*~?\\ref\{'
  - id: abbreviations_first_use
    rule: Every abbreviation is defined at first use in the text, in table and figure descriptions, and in the abstract (commonly understood ones excepted).
  - id: numerals_dates_currency
    rule: Numerals for percentages, years, and table/figure numbers; spell out numbers below ten in prose; percentages as "12.3%"; '×' rather than '·' for multiplication; a serial comma before "and" in lists of three or more.
  - id: table_figure_notes
    rule: "Every table and figure description sits above the exhibit (below the title) and is self-contained: what the entries are, the standard errors, the significance-star legend; numeral column headings carry no parentheses."
  - id: figure_labels
    rule: Axis labels carry units in parentheses; legends name the series exactly as the text does; each graph inside a multi-graph figure has its own title.
  - id: spelling_compounds
    rule: American spelling throughout; compound modifiers hyphenated before the noun ("risk-aversion measure"); no hyphen after -ly adverbs.
  - id: math_typography
    rule: Upright operators (\log, \exp); italic variables only; \text{} for multi-letter subscripts; no double sub/superscripts stacked on one symbol.
  - id: dual_affiliations_and
    rule: Affiliations (in the \thanks block on the title page) are listed as the main institution followed by the school with no comma ("University of Washington Foster School of Business"); dual affiliations are joined by "and".
