# Journal of Finance — two binding documents, keyed to the manuscript's stage.
# SUBMISSION: "Submission Guidelines and Policies, Rev. March 12, 2024" binds
# every submitted PDF — the layout and length facts below are ITS numbers (a
# breach of 1.e is automatic rejection). ACCEPTED-PAPER STYLE: "JF Style,
# February 2017" governs production — structure, numbering, citation form and
# the house list are taken from it so the accepted version needs no rewrite,
# but it never tightens a submission fact (its "all text double-spaced" is a
# production setting; the submission floor is 1.5, so both kinds are accepted).
journal: JF
name: Journal of Finance
sources:
  - "https://afajof.org/wp-content/uploads/JF_Submission_Guidelines.pdf (Submission Guidelines and Policies, Rev. March 12, 2024; fetched and read in full 2026-09-20, verbatim): refereeing is single blind — the title page carries the title, the authors' names and an abstract of no more than 100 words; 1.e: all manuscripts must be submitted in PDF format and must not exceed 60 pages, with at least 1.5 line spacing, 12-point font, 1-inch side margins, and 1.5-inch top/bottom margins; this page limit includes internal appendices, reference lists, figures, and tables; manuscripts exceeding these limits will be automatically rejected; additional material may be included in an Internet Appendix at the end of the PDF file, clearly identified as such (starting on a new page with 'Internet Appendix' written in large font at the top), and the manuscript must be self-contained without it; 1.f: footnotes at the bottom of the page on which they are referenced; 1.g: tables and figures embedded or at the end; 1.h: all but very short mathematical expressions displayed on a separate line, equations numbered consecutively on the right margin; 1.i: an abstract of no more than 100 words; 1.j: the introduction emphasizes the incremental contribution with citations kept to the minimum, and the article ends with a brief nontechnical summary of the main conclusions; 1.k: a supplementary appendix becomes the Internet Appendix on acceptance"
  - "https://afajof.org/wp-content/uploads/files/policies-and-guidelines/JF_Style_-_February_2017.pdf (accepted-paper style; fetched 2026-09-13, re-read 2026-09-20, verbatim): all text double-spaced (production — the submission floor above is 1.5); abstract double-spaced and not more than 100 words; the introduction is not numbered as a separate section, nor is it titled; the first paragraph of the introduction is not indented; Section I should be the first section following the introduction; the final paragraph of the introduction should outline the remainder of the paper; sections numbered with Roman numerals, subsection headings lettered A, B, C, subsubsections A.1, A.2; tables numbered with Roman numerals with a title and descriptive legend, portrait, up to 8 columns, 12-point; figures numbered with Arabic numerals with a caption; equations numbered consecutively in the right margin with Arabic numerals in parentheses; the initial footnote identifying the author(s) marked with an asterisk at the bottom of the title page; footnotes double-spaced, never more than the page count; references by author name and date — Tufano (1996) or (Tufano (1996)) — 'et al.' for four or more authors; references on a separate page, unnumbered, double spaced, and must include first names of all authors; appendices lettered A, B, C (a single appendix unlettered), appendix tables AI, AII, appendix figures and equations A1, A2; literary present tense; '%' not 'percent'; 'See, for example,' not 'See, e.g.'; indicate the location of figures and tables in the text"
verified:
  date: 2026-09-20
  sections: [layout, length, structure, citations]
layout:
  font_pt: 12
  margins: {top: 1.5in, bottom: 1.5in, left: 1in, right: 1in}
  spacing: double              # the accepted-paper format (JF Style, February 2017); a submission may be 1.5-spaced
length:
  pages: 60
  abstract_words: 100
structure:
  numbering: {section: Roman, subsection: Alph, subsubsection: arabic}
  exhibit_numbering: {table: roman, figure: arabic}
  appendix_title: Internet Appendix
  exhibits: end
  float_markers: true
  title_page: full
citations:
  in_text: citet_in_parens
  full_authors_first: false
house:
  - id: introduction_unnumbered_untitled
    rule: "The introduction is neither numbered nor titled: no \\section{Introduction} heading — the body text opens directly after the abstract, its first paragraph unindented, and Section I is the first titled section; the introduction's last paragraph outlines the remainder of the paper."
    locate: '\\section\*?\s*\{\s*Introduction\s*\}'
  - id: et_al_four_plus
    rule: "'et al.' only for four or more authors; three authors are always listed in full."
  - id: present_tense
    rule: Literary present tense throughout ("we predict", not "we predicted"); past tense only for describing what was done in prior work or in the data collection.
  - id: percent_symbol
    rule: "Use the percent symbol (%) for percentages, never the word 'percent'; 'See, for example,' rather than 'See, e.g.'."
    locate: '\bpercent\b|e\.g\.'
  - id: footnote_budget
    rule: The number of footnotes must not exceed the number of pages; table footnotes carry technical information only (significance levels).
  - id: appendix_exhibits
    rule: Appendix tables are numbered AI, AII, ...; appendix figures and equations A1, A2, ...; a single appendix is unlettered.
  - id: table_legend_length
    rule: A table legend over 300 words moves its variable construction into a separate definitions table or appendix and points there; legends may refer back to a previous table.
  - id: reference_first_names
    rule: "The reference list gives the first names of all authors. The shipped `chicago` style abbreviates them (`{f.}` — 'Kamstra, M. J.'), so it cannot satisfy this: switch \\bibliographystyle in style.tex to a style that prints full first names (`aer` formats `{ff}`) and check the compiled .bbl; the .bib author fields must carry full first names, never initials."
  - id: production_double_spacing
    rule: "Accepted-paper (production) files are double-spaced throughout, footnotes and references included (Style Guide, February 2017): `apply` installs the body's \\doublespacing; double-space the footnotes and the reference list by hand."

  - id: closing_summary
    rule: "The article ends with a brief nontechnical summary of the main conclusions (Submission Guidelines 1.j)."
